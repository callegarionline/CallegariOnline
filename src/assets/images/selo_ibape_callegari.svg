<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%" class="w-full h-full">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldScallop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="25%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#fbbf24" />
      <stop offset="75%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <radialGradient id="goldRadial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#fef9c3" />
      <stop offset="40%" stopColor="#f59e0b" />
      <stop offset="80%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#92400e" />
    </radialGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fffbeb" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>

    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fde047" />
      <stop offset="35%" stopColor="#d97706" />
      <stop offset="70%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <radialGradient id="silverRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stopColor="#cbd5e1" />
      <stop offset="85%" stopColor="#64748b" />
      <stop offset="100%" stopColor="#334155" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="medalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" floodColor="#000" floodOpacity="0.4" />
    </filter>

    <!-- Curved Text Paths -->
    <!-- Outer Text Path (Clockwise around outer edge) -->
    <!-- R = 175, Center = 240, 210 -->
    <path id="outerTextPathTop" d="M 68,210 A 172,172 0 1,1 412,210" fill="none" />
    <path id="outerTextPathBottom" d="M 412,210 A 172,172 0 0,1 68,210" fill="none" />
    
    <!-- Inner Text Path for PROFISSIONAL CERTIFICADO -->
    <path id="innerTextPath" d="M 140,215 A 108,108 0 1,1 340,215" fill="none" />
  </defs>

  <g filter="url(#medalShadow)">
    <!-- 1. RIBBON (BEHIND MEDALLION) -->
    <g id="ribbonBanner">
      <!-- Ribbon tail banner hanging from bottom of medallion -->
      <polygon points="175,340 305,340 305,485 240,445 175,485" fill="url(#ribbonGold)" stroke="#b45309" stroke-width="2.5" />
      <!-- Ribbon inner border -->
      <polygon points="182,345 298,345 298,470 240,432 182,470" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.8" />
      <!-- Ribbon fold shading lines -->
      <line x1="175" y1="340" x2="305" y2="340" stroke="#78350f" stroke-width="2" />
      
      <!-- Ribbon Text: ENGENHARIA DE AVALIAÇÕES -->
      <text x="240" y="405" text-anchor="middle" fill="#0f2b5c" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" letter-spacing="0.05em">
        ENGENHARIA
      </text>
      <text x="240" y="425" text-anchor="middle" fill="#0f2b5c" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" letter-spacing="0.08em">
        DE AVALIAÇÕES
      </text>
    </g>

    <!-- 2. SCALLOPED GOLD OUTER RIM (Medallion Center: 240, 210, Radius: 200) -->
    <g id="scallopEdge" fill="url(#goldScallop)" stroke="#b45309" stroke-width="1.5">
      <!-- 36 Scalloped Petals using circles -->
      <!-- Generated scalloped coin edge -->
      <circle cx="240" cy="210" r="195" fill="url(#goldScallop)" />
      <!-- Perimeter scallop bumps -->
      <path d="
        M 240,12
        A 12,12 0 0,1 273,15 A 12,12 0 0,1 305,24 A 12,12 0 0,1 334,39 A 12,12 0 0,1 360,59
        A 12,12 0 0,1 382,83 A 12,12 0 0,1 399,111 A 12,12 0 0,1 411,141 A 12,12 0 0,1 417,173
        A 12,12 0 0,1 417,206 A 12,12 0 0,1 411,238 A 12,12 0 0,1 398,268 A 12,12 0 0,1 379,295
        A 12,12 0 0,1 356,319 A 12,12 0 0,1 329,339 A 12,12 0 0,1 299,353 A 12,12 0 0,1 267,361
        A 12,12 0 0,1 234,362 A 12,12 0 0,1 202,356 A 12,12 0 0,1 172,344 A 12,12 0 0,1 144,325
        A 12,12 0 0,1 120,302 A 12,12 0 0,1 100,275 A 12,12 0 0,1 86,246 A 12,12 0 0,1 78,214
        A 12,12 0 0,1 77,182 A 12,12 0 0,1 82,150 A 12,12 0 0,1 94,120 A 12,12 0 0,1 112,93
        A 12,12 0 0,1 135,69 A 12,12 0 0,1 161,50 A 12,12 0 0,1 190,34 A 12,12 0 0,1 221,24 Z
      " fill="url(#goldScallop)" stroke="#b45309" stroke-width="2" />
    </g>

    <!-- Outer concentric gold groove -->
    <circle cx="240" cy="210" r="185" fill="none" stroke="#78350f" stroke-width="1.5" />
    <circle cx="240" cy="210" r="182" fill="url(#goldRadial)" stroke="#fef08a" stroke-width="1" />

    <!-- 3. CIRCULAR TEXT IN GOLD BAND -->
    <!-- Top Text: CONSULTE A VALIDADE DESTE CERTIFICADO NO SITE DO IBAPE -->
    <g fill="#0f2b5c" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.08em">
      <text>
        <textPath href="#outerTextPathTop" startOffset="50%" text-anchor="middle">
          CONSULTE A VALIDADE DESTE CERTIFICADO NO SITE DO IBAPE
        </textPath>
      </text>
      <!-- Bottom Text: • WWW.IBAPE-NACIONAL.COM.BR • -->
      <text font-size="12.5" font-weight="900" letter-spacing="0.12em">
        <textPath href="#outerTextPathBottom" startOffset="50%" text-anchor="middle">
          • WWW.IBAPE-NACIONAL.COM.BR •
        </textPath>
      </text>
    </g>

    <!-- 4. INNER BEADED RING (Silver dots on metallic ring) -->
    <circle cx="240" cy="210" r="150" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <circle cx="240" cy="210" r="148" fill="url(#silverRing)" />
    <circle cx="240" cy="210" r="132" fill="url(#goldRadial)" stroke="#78350f" stroke-width="2" />

    <!-- Silver/White Beads along the circle (R=140, Center=240,210) -->
    <g fill="#f8fafc" stroke="#475569" stroke-width="0.5">
      <circle cx="240" cy="70" r="3" />
      <circle cx="262" cy="72" r="3" />
      <circle cx="284" cy="77" r="3" />
      <circle cx="304" cy="86" r="3" />
      <circle cx="323" cy="99" r="3" />
      <circle cx="339" cy="115" r="3" />
      <circle cx="351" cy="133" r="3" />
      <circle cx="360" cy="154" r="3" />
      <circle cx="364" cy="176" r="3" />
      <circle cx="365" cy="198" r="3" />
      <circle cx="361" cy="220" r="3" />
      <circle cx="353" cy="242" r="3" />
      <circle cx="341" cy="261" r="3" />
      <circle cx="325" cy="278" r="3" />
      <circle cx="306" cy="292" r="3" />
      <circle cx="285" cy="301" r="3" />
      <circle cx="263" cy="307" r="3" />
      <circle cx="240" cy="309" r="3" />
      <circle cx="217" cy="307" r="3" />
      <circle cx="195" cy="301" r="3" />
      <circle cx="174" cy="292" r="3" />
      <circle cx="155" cy="278" r="3" />
      <circle cx="139" cy="261" r="3" />
      <circle cx="127" cy="242" r="3" />
      <circle cx="119" cy="220" r="3" />
      <circle cx="115" cy="198" r="3" />
      <circle cx="116" cy="176" r="3" />
      <circle cx="120" cy="154" r="3" />
      <circle cx="129" cy="133" r="3" />
      <circle cx="141" cy="115" r="3" />
      <circle cx="157" cy="99" r="3" />
      <circle cx="176" cy="86" r="3" />
      <circle cx="196" cy="77" r="3" />
      <circle cx="218" cy="72" r="3" />
